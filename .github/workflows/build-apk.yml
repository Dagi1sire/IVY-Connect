name: Build & Package Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
          platform-tools
          platforms;android-34
          platforms;android-35
          build-tools;34.0.0
          build-tools;35.0.0
        accept-android-sdk-licenses: true

      - name: Prepare Keystore & Environment Files
        run: |
          # Restore debug.keystore if base64 encoded file exists, or generate a fresh one
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating new debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ensure .env exists so Secrets Gradle Plugin succeeds
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              echo "Creating .env from .env.example..."
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Outputs
        run: |
          mkdir -p release-artifacts
          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" release-artifacts/ivy-parent-connect-debug.apk
            cp "$APK_SRC" release-artifacts/app-debug.apk
            echo "APK successfully built and prepared."
          else
            echo "Error: Output APK not found at $APK_SRC"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ivy-parent-connect-debug-apk
          path: release-artifacts/*.apk
          retention-days: 30

      - name: Publish to GitHub Releases (Tags or Manual Trigger)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          name: ${{ github.ref_name }}
